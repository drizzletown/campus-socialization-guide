name: Verify SSCM book and GitHub Pages site
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python build.py && python extras.py && python decision_lab.py && python reader_lab.py && python bilingual.py
      - run: python tools/validate.py && python tools/release_audit.py
      - run: node --check docs/assets/site.js && node --check docs/assets/search-core.js && node --check docs/en/site-en.js && node tools/simulated_reader_trial.js
      - name: Generated pages must match the checked-in Markdown
        run: git diff --exit-code
